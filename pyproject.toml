[project]
name = "airflow-pricing-pipeline"
version = "0.1.0"
description = "Indicadores diários de preço por categoria da FakeStore API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-airflow[postgres]==3.4.0",
    "apache-airflow-providers-postgres==7.1.1",
    "pendulum==3.3.0",
    "psycopg[binary]>=3.3,<4",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]
analytics = ["ipykernel>=6,<8", "matplotlib>=3.9,<4", "nbconvert>=7,<8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dags"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
